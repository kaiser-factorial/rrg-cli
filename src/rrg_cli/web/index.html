<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="rrg-token" content="__RRG_TOKEN__">
  <title>RRG validation pipeline</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark">RRG</span><div><h1 id="project-name">Validation pipeline</h1><p id="project-root"></p></div></div>
    <nav aria-label="Workflow">
      <button data-view="dashboard" class="active">Dashboard</button>
      <details class="navgroup"><summary>Study</summary><div class="navmenu">
        <button data-view="setup">Setup</button>
        <button data-view="convert">Convert</button>
        <!-- Origin under Study is tentative — may move next to Review &amp; Grade (it's both an input and a grading companion). -->
        <button data-view="origin">Origin</button>
      </div></details>
      <details class="navgroup"><summary>Validate</summary><div class="navmenu">
        <button data-view="build">Build</button>
        <button data-view="prompts">Prompts</button>
        <button data-view="runs">Runs</button>
      </div></details>
      <button data-view="review">Review &amp; Grade</button>
      <details class="navgroup utility"><summary>Workspace</summary><div class="navmenu">
        <button data-view="files">Files</button>
        <button data-view="projects">Projects</button>
      </div></details>
      <button data-view="guide">Guide</button>
    </nav>
  </header>
  <main id="app" aria-live="polite"><div class="card loading">Loading project…</div></main>
  <div id="toast" role="status"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
