version: 1
project:
  name: starter-validation

paths:
  shared: shared
  data: data
  operator: operator
  packages: operator/_packages
  compare_notes: operator/_compare_notes

origin:
  vendor: OriginVendor
  model: OriginModel
  results_key: operator/origin
  source_data: data/source.csv

files:
  all:
    - shared/STUDY_OVERVIEW.md
    - shared/QUESTIONS.md
    - shared/VALIDATION_INSTRUCTIONS.md
    - data/analysis.csv
    - data/analysis.parquet
    - data/analysis.meta.json
    - data/analysis.codebook.csv
  stage_specific:
    - file: shared/ANALYSIS_PROTOCOL_OG.md
      send_in: [replication]
  withheld:
    - operator/origin/
    - "operator/**/SCORECARD_*"
    - operator/private/

roster:
  replication:
    - model: ReplicationModel
      vendor: IndependentVendor
      type: open
      license: record-at-run-time
  robustness:
    - model: RobustnessModel
      vendor: AnotherVendor
      type: frontier
      license: record-at-run-time
  generalization: []

stages:
  replication:
    order: 1
    enabled: true
    opens: model
    methodology: revealed
    prompt: prompts/replication.md
    send: [all, shared/ANALYSIS_PROTOCOL_OG.md]
    output_folder: replication_{model}
    report_name: "{model}_Report.docx"
  robustness:
    order: 2
    enabled: true
    opens: method
    methodology: hidden
    prompt: prompts/robustness.md
    send: [all]
    output_folder: robustness_{model}
    report_name: "{model}_Report.docx"
  generalization:
    order: 3
    enabled: false
    blocked_reason: Define the data-variation plan and method policy before enabling.
    opens: data
    methodology: decide-in-cartridge
    prompt: prompts/generalization.md
    send: [all]
    output_folder: generalization_{model}
    report_name: "{model}_Report.docx"

blinding:
  always_withhold:
    - origin/
    - SCORECARD_*
    - private/
    - ORIGINAL_METHODOLOGY.md
  per_stage_methodology:
    replication:
      require: [ANALYSIS_PROTOCOL_OG.md]
      forbid: []
    robustness:
      require: []
      forbid: [ANALYSIS_PROTOCOL_OG.md, "*PROTOCOL*", ORIGINAL_METHODOLOGY.md]
    generalization:
      require: []
      forbid: [ORIGINAL_METHODOLOGY.md]
  result_token_scan:
    source: operator/origin
    action: flag
    exclude_globs: ["*.csv", "*.parquet", "*.json"]
    ignore_tokens: []

constraints:
  exclude_vendors: [OriginVendor]
  determinism:
    temperature: 0
    seed: fixed

dispatch:
  start_template: "agent run --model {model_slug}"
  model_slugs:
    ReplicationModel: provider/replication-model
    RobustnessModel: provider/robustness-model
