study:
  title: Starter validation study
  overview_file: shared/STUDY_OVERVIEW.md
  dataset:
    source: data/source.csv
    main_name: analysis
    merge_key: id
    formats: [csv, parquet]
    codebook: data/analysis.codebook.csv
    metadata: data/analysis.meta.json
    orientation: >-
      Use {MAIN_DATASET} in one of these equivalent formats: {FORMATS}. Variable
      definitions are in {CODEBOOK} and conversion metadata is in {METADATA}.
    aux:
      enabled: false
      name: ""
      file: ""
      note: ""
  given_solution:
    enabled: false
    glossary: ""
    artifacts: []
    note: ""
  additional: []
  questions:
    file: shared/QUESTIONS.md
    count: 3
    map: questions_map.yaml
  held_constants:
    file: shared/VALIDATION_INSTRUCTIONS.md
    summary: the study's construct and grouping definitions
    qa_groups: all fixed grouping definitions
  original:
    methodology_file: shared/ANALYSIS_PROTOCOL_OG.md
    results_key: operator/origin
    model: OriginModel
    vendor: OriginVendor
    summary_file: operator/origin/SUMMARY.md
    methodology_prompt: operator/OG_METHODOLOGY_PROMPT.md
  deliverable:
    report_name: "{MODEL}_Report.md"
    reporting_spec: >-
      For each question, deliver a reproducible artifact chain: `Q<n>_analysis.py`
      runs the analysis and writes `raw/Q<n>_raw.csv`; `Q<n>_fig.py` reads that and
      writes `Q<n>_fig.png`. Also record `raw/Q<n>_summary.json` (machine-readable:
      analysis N, descriptive inputs, point estimate, uncertainty, effect size where
      applicable, and a one-sentence conclusion). Write the report in DYFA format: one
      section per question, labelled `D - Do` (what you ran), `Y - Why`, `F - Find`
      (the result), and `A - Answer`, embedding the matching `Q<n>_fig.png`. Provide
      `RAW.md` and `SUMMARY.md` indexing the per-question artifacts.
    method_guide:
      enabled: false
      name: ""
      file: ""
