study:
  title: Hypothesis testing of movie ratings data
  overview_file: shared/STUDY_OVERVIEW.md
  dataset:
    source: data/movieReplicationSet.csv
    main_name: movie_ratings
    merge_key: ''
    formats:
    - csv
    - parquet
    codebook: data/movie_ratings.codebook.csv
    metadata: data/movie_ratings.meta.json
    orientation: Analyze the 1,097 participant rows in {MAIN_DATASET}, available in the equivalent formats
      {FORMATS}. Column definitions and conversion metadata are in {CODEBOOK} and {METADATA}. There is
      no respondent identifier and no cross-file merge is required.
    aux:
      enabled: false
      name: ''
      file: ''
      note: ''
  given_solution:
    enabled: false
    glossary: ''
    artifacts: []
    note: ''
  additional: []
  questions:
    file: shared/QUESTIONS.md
    count: 11
    map: questions_map.yaml
  held_constants:
    file: shared/VALIDATION_INSTRUCTIONS.md
    summary: the 400 movie columns, participant coding, missing-value rules, significance threshold, named
      movies, franchise keywords, and question order
    qa_groups: gender, sibling status, movie-watching preference, and sensation seeking
  original:
    methodology_file: shared/ANALYSIS_PROTOCOL_OG.md
    results_key: operator/origin
    summary_file: operator/origin/SUMMARY.md
    methodology_prompt: operator/OG_METHODOLOGY_PROMPT.md
    model: Corina-Kaiser-2025
    vendor: Human
  deliverable:
    report_name: '{MODEL}_MovieRatings_Report.md'
    reporting_spec: >-
      Produce the same deliverables for every question, identically, so the outputs are
      directly comparable. For each question n: (1) an analysis script `Q<n>_analysis.py`
      that writes its raw outputs to `raw/Q<n>_raw.csv`; (2) a figure script `Q<n>_fig.py`
      that reads that CSV and writes `Q<n>_fig.png` — use that exact filename; (3) a
      machine-readable `raw/Q<n>_summary.json`, a single flat JSON object that always
      includes `question`, `n` (analysis N), `groups` (group definitions), `test` (test
      and alternative), `statistic`, `p_value` (exact, never a rounded 0), `effect_size`
      (null if not applicable), `multiplicity` (correction treatment), and `conclusion`
      (one sentence at alpha 0.005) — add extra keys as the question needs; (4) a report
      section in DYFA format labelled `D - Do`, `Y - Why`, `F - Find`, `A - Answer`,
      embedding `Q<n>_fig.png`. Also write `RAW.md` and `SUMMARY.md` indexing the
      per-question artifacts. Before finishing, confirm every question has all four —
      script+csv, fig+png, summary.json, and a DYFA section — and that no
      `raw/Q<n>_summary.json` is missing.
    method_guide:
      enabled: false
      name: ''
      file: ''
